<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زوم‌تک | فناوری از نزدیک</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root,[data-theme="orange"]{
  --accent:#ff7a18; --accent2:#ffb347; --neon:#ff7a18; --neon2:#ffb347;
  --glow:rgba(255,122,24,.55); --accent-soft:rgba(255,122,24,.15);
  --bg:#0a0806; --card:#141110; --text:#f4f1ee; --body-text:#d6d1cb;
  --muted:#a49b93; --border:#2a2320; --header-bg:rgba(20,17,16,.92); --input-bg:rgba(255,255,255,.05);
}
[data-theme="pink"]{
  --accent:#ff2d95; --accent2:#ff86c8; --neon:#ff2d95; --neon2:#ff86c8;
  --glow:rgba(255,45,149,.55); --accent-soft:rgba(255,45,149,.15);
  --bg:#0b060a; --card:#151016; --text:#f7eef5; --body-text:#e2d0dc;
  --muted:#a894a2; --border:#2c1f28; --header-bg:rgba(21,16,22,.92); --input-bg:rgba(255,255,255,.05);
}
[data-theme="red"]{
  --accent:#ff2b2b; --accent2:#ff7373; --neon:#ff2b2b; --neon2:#ff7373;
  --glow:rgba(255,43,43,.55); --accent-soft:rgba(255,43,43,.15);
  --bg:#0a0505; --card:#151010; --text:#f7eeee; --body-text:#e2cece;
  --muted:#a89494; --border:#2c1e1e; --header-bg:rgba(21,16,16,.92); --input-bg:rgba(255,255,255,.05);
}
[data-theme="blue"]{
  --accent:#2b9bff; --accent2:#7cc7ff; --neon:#2b9bff; --neon2:#7cc7ff;
  --glow:rgba(43,155,255,.55); --accent-soft:rgba(43,155,255,.15);
  --bg:#05080f; --card:#0f141d; --text:#eef4fb; --body-text:#cdd9e7;
  --muted:#94a1b2; --border:#1e2a38; --header-bg:rgba(15,20,29,.92); --input-bg:rgba(255,255,255,.05);
}
:root{ --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-hover:0 18px 45px rgba(0,0,0,.55); }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-top:74px;
  background:radial-gradient(900px 500px at 85% -10%, var(--glow), transparent 60%),
             radial-gradient(800px 500px at 10% 110%, var(--glow), transparent 60%), var(--bg);
  color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
video{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px}
.container{max-width:1180px;margin:0 auto;padding:0 18px}

@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bar{0%{width:0}100%{width:100%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes neonPulse{
  0%,100%{box-shadow:0 0 10px var(--glow),0 0 26px var(--glow),inset 0 0 16px rgba(0,0,0,.65)}
  50%{box-shadow:0 0 18px var(--neon),0 0 48px var(--glow),inset 0 0 22px rgba(0,0,0,.75)}
}

.reveal{opacity:0;transform:translateY(36px) scale(.985);
  transition:opacity .75s cubic-bezier(.2,.7,.3,1), transform .75s cubic-bezier(.2,.7,.3,1);
  will-change:opacity, transform;}
.reveal.visible{opacity:1;transform:none}

.pin-badge{position:absolute;top:10px;right:10px;z-index:4;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:800;
  box-shadow:0 4px 14px var(--glow),0 0 14px var(--glow);
  display:inline-flex;align-items:center;gap:4px;animation:pop .45s both;}
.pin-badge.on-feature{position:static;align-self:flex-start;margin-bottom:2px;animation:pop .5s both;}

#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;
  align-items:center;justify-content:center;transition:opacity .6s,visibility .6s;}
#loader.hide{opacity:0;visibility:hidden}
.loader-box{text-align:center;animation:fadeUp .6s both}
.loader-logo{width:84px;height:84px;border-radius:24px;margin:0 auto 16px;object-fit:cover;
  box-shadow:0 0 30px var(--glow);animation:float 2s ease-in-out infinite;}
.loader-name{font-weight:800;font-size:20px;margin-bottom:4px;color:var(--text)}
.loader-slogan{color:var(--muted);font-size:13px;margin-bottom:18px}
.loader-bar{width:180px;height:5px;background:rgba(255,255,255,.1);border-radius:99px;margin:0 auto;overflow:hidden}
.loader-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 12px var(--glow);animation:bar 1.1s ease forwards}

.header{position:fixed;top:0;right:0;left:0;height:74px;z-index:100;background:var(--header-bg);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.35);}
.header-inner{max-width:1180px;margin:0 auto;height:100%;padding:0 18px;display:flex;align-items:center;gap:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);transition:.3s;}
.icon-btn:hover{background:rgba(255,255,255,.14);transform:scale(1.05)}
.bars{display:block;width:20px;height:14px;position:relative}
.bars i{position:absolute;right:0;height:2.4px;border-radius:9px;background:var(--text);transition:.35s;display:block}
.bars i:nth-child(1){top:0;width:20px}.bars i:nth-child(2){top:6px;width:14px}.bars i:nth-child(3){top:12px;width:20px}
body.drawer-open .bars i:nth-child(1){top:6px;transform:rotate(45deg)}
body.drawer-open .bars i:nth-child(2){opacity:0;transform:translateX(-8px)}
body.drawer-open .bars i:nth-child(3){top:6px;transform:rotate(-45deg)}
.brand{display:flex;align-items:center;gap:11px;margin-left:auto}
.brand img{width:44px;height:44px;border-radius:13px;object-fit:cover;box-shadow:0 0 18px var(--glow)}
.brand-text b{display:block;font-size:17px;line-height:1.2;color:var(--text)}
.brand-text small{color:var(--muted);font-size:11.5px}
.header-actions{display:flex;gap:9px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:13px;
  font-size:13.5px;font-weight:700;transition:.28s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 22px var(--glow);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px var(--glow)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn-ok{background:rgba(74,222,128,.15);color:#4ade80}
.btn-ok:hover{background:rgba(74,222,128,.25)}
.btn-no{background:rgba(255,107,107,.15);color:#ff6b6b}
.btn-no:hover{background:rgba(255,107,107,.25)}
.btn-line{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-line:hover{border-color:var(--accent);color:var(--accent)}
.btn-pin{background:var(--accent-soft);color:var(--neon);border:1px solid var(--neon)}
.btn-pin:hover{background:var(--neon);color:#fff;box-shadow:0 0 14px var(--glow)}
.btn-pin.active{background:var(--neon);color:#fff;box-shadow:0 0 14px var(--glow)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:.35s;z-index:110;}
.overlay.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;background:var(--card);z-index:120;
  transform:translateX(106%);transition:transform .45s cubic-bezier(.16,.84,.3,1);
  box-shadow:-24px 0 70px rgba(0,0,0,.5);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.drawer-head img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 0 14px var(--glow)}
.drawer-head b{display:block;font-size:15px;color:var(--text)}
.drawer-head small{color:var(--muted);font-size:11.5px}
.drawer-nav{padding:14px;overflow:auto;flex:1}
.drawer-link{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:14px;
  font-size:14.5px;font-weight:600;margin-bottom:6px;transition:.25s;opacity:0;color:var(--text);}
.drawer.open .drawer-link{animation:fadeUp .45s both}
.drawer-link::before{content:"";width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.2);transition:.25s;flex:none;}
.drawer-link:hover{background:rgba(255,255,255,.06);transform:translateX(-6px)}
.drawer-link:hover::before{background:var(--neon);box-shadow:0 0 0 4px var(--accent-soft)}
.drawer-foot{padding:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center}

main{min-height:60vh;padding:26px 0 60px}
.page-title{font-size:22px;margin:0 0 18px;position:relative;padding-right:14px;
  animation:fadeUp .5s both;color:var(--text);}
.page-title::before{content:"";position:absolute;right:0;top:6px;bottom:6px;width:5px;border-radius:9px;
  background:linear-gradient(var(--accent),var(--accent2));box-shadow:0 0 12px var(--glow);}

.feature{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--card);border-radius:24px;
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px;transition:transform .4s, box-shadow .4s, border-color .4s;
  border:1px solid var(--border);}
.feature:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.feature img{width:100%;height:100%;min-height:290px;object-fit:cover;transition:.6s}
.feature:hover img{transform:scale(1.05)}
.feature-body{padding:26px 24px;display:flex;flex-direction:column;justify-content:center;gap:11px}
.feature-body h2{margin:0;font-size:23px;line-height:1.55;color:var(--text)}
.feature-body p{margin:0;color:var(--muted);font-size:14px;line-height:1.9}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .35s, box-shadow .35s, border-color .35s;
  display:flex;flex-direction:column;border:1px solid var(--border);}
.card:hover{transform:translateY(-7px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.card-img{aspect-ratio:16/9;overflow:hidden;background:rgba(255,255,255,.03);position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover .card-img img{transform:scale(1.08)}
.vid-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.75);color:#fff;
  padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;backdrop-filter:blur(4px);}
.card-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h3{margin:0;font-size:15.5px;line-height:1.75;color:var(--text)}
.excerpt{margin:0;color:var(--muted);font-size:12.5px;line-height:1.85}
.badge{display:inline-block;align-self:flex-start;background:var(--accent-soft);color:var(--neon);
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;text-shadow:0 0 8px var(--glow);}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:auto;padding-top:6px}

.article{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--border);}
.article-cover{width:100%;max-height:430px;object-fit:cover}
.article-in{padding:26px}
.article-in h1{margin:12px 0 14px;font-size:27px;line-height:1.6;color:var(--text)}
.article-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;
  padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}
.article-body{font-size:15px;line-height:2.15;color:var(--body-text)}
.article-body p{margin:0 0 16px}
.article-body img{border-radius:14px;margin:14px 0}
.video-slot{margin:16px 0}
.video-slot video,.video-slot iframe{width:100%;max-height:560px;background:#000;
  border-radius:14px;display:block;border:1px solid var(--border);}
.video-slot iframe{aspect-ratio:16/9;max-height:none}
.article-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}

.panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);
  border:1px solid var(--border);}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text)}
.field input[type=text],.field input[type=password],.field input[type=url],.field textarea,.field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:13px;background:var(--input-bg);
  transition:.25s;outline:none;color:var(--text);}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--accent);background:rgba(255,255,255,.08);box-shadow:0 0 0 4px var(--accent-soft);}
.field textarea{min-height:170px;resize:vertical;line-height:1.9}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0}
.preview{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-top:12px;border:1px solid var(--border)}
.filebox{border:2px dashed var(--border);border-radius:16px;padding:20px;text-align:center;transition:.3s;
  background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;color:var(--muted);display:block;}
.filebox:hover{border-color:var(--accent);background:rgba(255,255,255,.06);color:var(--accent)}
.filebox input{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:10px 17px;border-radius:13px;background:var(--card);font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow);transition:.25s;border:1px solid var(--border);color:var(--text);}
.tab:hover{transform:translateY(-2px);border-color:var(--accent)}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 10px 26px var(--glow);border-color:transparent}
.list-item{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid var(--border);
  border-radius:16px;margin-bottom:10px;background:var(--card);transition:border-color .25s, transform .25s;flex-wrap:wrap;}
.list-item:hover{border-color:var(--accent);transform:translateX(-4px)}
.list-item img{width:74px;height:56px;border-radius:11px;object-fit:cover;flex:none}
.list-item .li-body{flex:1;min-width:140px}
.list-item .li-body b{display:block;font-size:13.5px;margin-bottom:4px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item .li-body small{color:var(--muted);font-size:11.5px}
.pill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800}
.pill.pend{background:rgba(181,119,0,.18);color:#ffc844}
.pill.ok{background:rgba(74,222,128,.15);color:#4ade80}
.pill.no{background:rgba(255,107,107,.15);color:#ff6b6b}
.pill.pin{background:var(--accent-soft);color:var(--neon);border:1px solid var(--neon)}

/* بخش‌های فرم تنظیمات متن */
.settings-section{
  padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);margin-bottom:16px;
}
.settings-section h4{
  margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--text);
}
.settings-section h4 .num{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--neon);
  font-size:11px;font-weight:800;border:1px solid var(--neon);
}

#modalWrap{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:18px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:.3s;}
#modalWrap.open{opacity:1;visibility:visible}
.modal{background:var(--card);border-radius:24px;padding:26px;width:100%;max-width:420px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);transform:scale(.85);transition:.35s cubic-bezier(.2,1.2,.4,1);
  max-height:90vh;overflow:auto;color:var(--text);border:1px solid var(--border);}
.modal.wide{max-width:640px}
#modalWrap.open .modal{transform:scale(1)}
.code-boxes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:18px 0}
.code-boxes span{width:44px;height:56px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--neon);font-size:24px;font-weight:900;
  border:1.5px solid var(--neon);box-shadow:0 0 12px var(--glow);animation:pop .5s both;}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,24px);z-index:500;
  background:var(--card);color:var(--text);padding:13px 22px;border-radius:14px;font-size:13px;font-weight:600;
  opacity:0;transition:.35s;box-shadow:0 16px 40px rgba(0,0,0,.6);max-width:90vw;text-align:center;
  border:1px solid var(--border);}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:#ff6b6b;color:#ff6b6b}
.toast.ok{border-color:#4ade80;color:#4ade80}

.footer{background:#06070a;color:#c9ccd6;padding:34px 0 22px;margin-top:30px;border-top:1px solid var(--border)}
.footer-inner{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;flex-wrap:wrap;
  gap:18px;align-items:center;justify-content:space-between;}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-brand img{width:48px;height:48px;border-radius:14px;object-fit:cover;box-shadow:0 0 16px var(--glow)}
.footer-brand b{display:block;color:#fff;font-size:16px}
.footer-brand small{color:#8d93a1;font-size:11.5px}
.credit{font-size:14px;font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:fadeUp .6s both;}
.footer-note{width:100%;text-align:center;color:#6b7180;font-size:11.5px;margin-top:14px;
  padding-top:14px;border-top:1px solid #1a1c22}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--border)}

.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:8px}
.neon-box{position:relative;display:block;padding:30px 22px 26px;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  border:2px solid var(--neon);
  box-shadow:0 0 10px var(--glow),0 0 26px var(--glow),inset 0 0 16px rgba(0,0,0,.65);
  animation:neonPulse 3.4s ease-in-out infinite;
  transition:transform .35s, border-color .35s, background .35s, box-shadow .35s;
  text-decoration:none;color:inherit;}
.neon-box:hover{transform:translateY(-8px);border-color:var(--neon2);
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  box-shadow:0 0 20px var(--neon),0 0 60px var(--glow),inset 0 0 24px rgba(0,0,0,.7);}
.neon-box::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);opacity:.6;}
.nb-icon{font-size:34px;line-height:1;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite}
.nb-label{font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--neon);
  text-shadow:0 0 10px var(--glow);margin-bottom:10px}
.nb-value{font-size:15px;font-weight:800;direction:ltr;text-align:right;word-break:break-all;
  color:#fff;text-shadow:0 0 8px var(--neon),0 0 22px var(--glow)}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .feature{grid-template-columns:1fr}
  .feature img{min-height:210px}
  .header-actions .btn-ghost{display:none}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}

/* ---------- IndexedDB برای ویدیوها ---------- */
const VDB = {
  _db:null,
  open(){
    return new Promise((res, rej) => {
      if(this._db) return res(this._db);
      const req = indexedDB.open('zt_videos', 1);
      req.onupgradeneeded = e => { e.target.result.createObjectStore('videos'); };
      req.onsuccess = e => { this._db = e.target.result; res(this._db); };
      req.onerror = e => rej(e);
    });
  },
  async put(key, blob){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('videos','readwrite');
      tx.objectStore('videos').put(blob, key);
      tx.oncomplete = () => res(key);
      tx.onerror = e => rej(e);
    });
  },
  async get(key){
    try{
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('videos','readonly');
        const req = tx.objectStore('videos').get(key);
        req.onsuccess = () => res(req.result);
        req.onerror = e => rej(e);
      });
    }catch(e){ return null; }
  },
  async del(key){
    try{
      const db = await this.open();
      return new Promise((res) => {
        const tx = db.transaction('videos','readwrite');
        tx.objectStore('videos').delete(key);
        tx.oncomplete = () => res();
        tx.onerror = () => res();
      });
    }catch(e){}
  }
};

let _revealObs = null;
function observeReveal(){
  const els = document.querySelectorAll('.reveal:not(.visible)');
  if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('visible')); return; }
  if(!_revealObs){
    _revealObs = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){ en.target.classList.add('visible'); _revealObs.unobserve(en.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -50px 0px' });
  }
  els.forEach(e => _revealObs.observe(e));
}

function readImage(file, cb){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('فقط فایل تصویری مجاز است','err'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => toast('عکس خوانده نشد','err');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function generateVideoThumbnail(file){
  return new Promise(res => {
    try{
      const v = document.createElement('video');
      v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const url = URL.createObjectURL(file);
      v.src = url;
      let done = false;
      const finish = (val) => { if(done) return; done = true; try{URL.revokeObjectURL(url);}catch(e){} res(val); };
      v.onloadeddata = () => { try{ v.currentTime = Math.min(1, (v.duration||2)/2); }catch(e){ finish(''); } };
      v.onseeked = () => {
        try{
          const MAX = 1200;
          let w = v.videoWidth, h = v.videoHeight;
          if(!w || !h) return finish('');
          if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(v, 0, 0, w, h);
          finish(c.toDataURL('image/jpeg', 0.82));
        }catch(e){ finish(''); }
      };
      v.onerror = () => finish('');
      setTimeout(() => finish(''), 4000);
    }catch(e){ res(''); }
  });
}

function videoEmbed(url){
  const u = String(url||'').trim();
  if(!u) return '';
  const yt = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]+)/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
  const ap = u.match(/aparat\.com\/v\/([\w-]+)/);
  if(ap) return `<iframe src="https://www.aparat.com/video/video/embed/videohash/${ap[1]}/vt/frame" allowfullscreen></iframe>`;
  return `<video controls src="${esc(u)}" preload="metadata"></video>`;
}

async function loadVideoInto(containerEl, post){
  if(!containerEl || !post) return;
  if(post.videoUrl){ containerEl.innerHTML = videoEmbed(post.videoUrl); return; }
  if(post.videoId){
    containerEl.innerHTML = '<div class="hint">در حال بارگذاری ویدیو…</div>';
    const blob = await VDB.get(post.videoId);
    if(!blob){ containerEl.innerHTML = '<div class="hint">ویدیوی این مطلب در حافظه این مرورگر موجود نیست.</div>'; return; }
    const objUrl = URL.createObjectURL(blob);
    containerEl.innerHTML = `<video controls poster="${esc(post.image||'')}" src="${objUrl}" preload="metadata"></video>`;
  }
}

function card(p, idx){
  const hasVideo = p.videoId || p.videoUrl;
  const delay = idx != null ? Math.min(idx, 8) * 60 : 0;
  return `<a class="card reveal" href="#/post/${p.id}" style="transition-delay:${delay}ms">
    <div class="card-img">
      <img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">
      ${p.pinned ? '<span class="pin-badge">📌 سنجاق</span>' : ''}
      ${hasVideo ? '<span class="vid-badge">🎬 ویدیو</span>' : ''}
    </div>
    <div class="card-body">
      <span class="badge">${esc(p.category)}</span>
      <h3>${esc(p.title)}</h3>
      <p class="excerpt">${esc(strip(p.content)).slice(0,105)}…</p>
      <div class="meta"><span>${esc(p.author||'کاربر')}</span><span>${faDate(p.date)}</span><span>👁 ${p.views||0}</span></div>
    </div>
  </a>`;
}

function sortPosts(list){
  return list.slice().sort((a,b) => {
    const ap = a.pinned ? 1 : 0, bp = b.pinned ? 1 : 0;
    if(ap !== bp) return bp - ap;
    return b.date - a.date;
  });
}

  const fHasVideo = f.videoId || f.videoUrl;
  html += `<a class="feature reveal" href="#/post/${f.id}">
      <img src="${esc(f.image)}" alt="${esc(f.title)}">

        ${f.pinned ? '<span class="pin-badge on-feature">📌 سنجاق‌شده</span>' : ''}

  $('#app').innerHTML = `<article class="article reveal">

    <div class="article-in">

        <span>👁 ${p.views}</span>
        <span>❤️ <b id="likeCount">${p.likes||0}</b></span>
        ${hasVideo ? '<span>🎬 دارای ویدیو</span>' : ''}
      </div>
      ${hasVideo ? '<div class="video-slot" id="videoSlot"></div>' : ''}
      <div class="article-body">${p.content}</div>
      <div class="article-actions">
        <button class="btn ${liked?'btn-no':'btn-primary'}" id="likeBtn" ${liked?'disabled':''}>
          ${liked ? 'پسندیده شد ❤️' : 'پسندیدن ❤️'}
        </button>
        <a class="btn btn-line" href="#/">← بازگشت به صفحه اصلی</a>
      </div>
    </div>
  </article>`;
  if(hasVideo) loadVideoInto($('#videoSlot'), p);
  const btn = $('#likeBtn');
  if(btn && !liked){
    btn.onclick = () => {
      p.likes = (p.likes||0) + 1;
      const l = LS.get('liked', []) || []; l.push(p.id); LS.set('liked', l);
      LS.set('posts', state.posts);
      $('#likeCount').textContent = p.likes;
      btn.disabled = true; btn.className = 'btn btn-no'; btn.textContent = 'پسندیده شد ❤️';
    };
  }
}

   نوشتن مطلب
========================================================= */
function viewWrite(){
  const me = state.me;
  $('#app').innerHTML = `<div class="panel reveal">
    <h2 class="page-title">نوشتن مطلب جدید</h2>
    ${ me ? `<div class="hint" style="background:var(--accent-soft);padding:12px;border-radius:12px;color:var(--accent);font-weight:700">
        شما به‌عنوان «${esc(me.name)}» وارد شده‌اید — کد اختصاصی شما: <b style="font-size:16px;letter-spacing:2px">${me.code}</b>
      </div>` : '' }
    <form id="writeForm" style="margin-top:16px">
      <div class="row">
        <div class="field"><label>نام شما</label>
          <input type="text" id="wName" value="${esc(me?me.name:'')}" required ${me?'readonly':''}></div>
        <div class="field"><label>${me?'کد شما':'کد قبلی (اختیاری)'}</label>
          <input type="text" id="wCode" placeholder="۶ رقم" ${me?'readonly':''} value="${me?me.code:''}"></div>
      </div>
      <div class="field"><label>عنوان</label><input type="text" id="wTitle" required></div>
      <div class="field"><label>دسته</label>
        <input type="text" id="wCat" list="cats" required>
        <datalist id="cats">${[...new Set(state.posts.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      </div>
      <div class="field"><label>عکس (اختیاری)</label>
        <label class="filebox" for="wImg">📷 انتخاب عکس<input type="file" id="wImg" accept="image/*"></label>
        <img id="wPreview" class="preview" style="display:none" alt="">
      </div>
      <div class="field"><label>🎬 ویدیو (حداکثر ۲۰۰MB)</label>
        <label class="filebox" for="wVid">🎬 انتخاب ویدیو<input type="file" id="wVid" accept="video/*"></label>
        <div id="wVidPreview" class="video-slot" style="display:none"></div>
        <div class="hint">یا لینک:</div>
        <input type="text" id="wVidUrl" dir="ltr">
      </div>
      <div class="field"><label>متن</label><textarea id="wBody" required></textarea></div>
      <button class="btn btn-primary" type="submit" id="wSubmit">ارسال برای بررسی مدیر</button>
    </form>
  </div>`;

  let imgData = '', videoFile = null;
  $('#wImg').addEventListener('change', e => {
    readImage(e.target.files[0], d => { imgData = d; const pv=$('#wPreview'); pv.src=d; pv.style.display='block'; });
  });
  $('#wVid').addEventListener('change', async e => {
    const f = e.target.files[0]; videoFile = null;
    if(!f) return;
    if(!f.type.startsWith('video/')){ toast('فقط ویدیو','err'); e.target.value=''; return; }
    if(f.size > MAX_VIDEO_BYTES){ toast('حجم بیش از ۲۰۰MB','err'); e.target.value=''; return; }
    videoFile = f; $('#wVidUrl').value='';
    const pv = $('#wVidPreview');
    pv.innerHTML = `<video controls src="${URL.createObjectURL(f)}" preload="metadata"></video>`;
    pv.style.display = 'block';
    if(!imgData){
      const thumb = await generateVideoThumbnail(f);
      if(thumb && !imgData){ imgData = thumb; const ip=$('#wPreview'); ip.src=thumb; ip.style.display='block'; }
    }
  });
  $('#wVidUrl').addEventListener('input', e => {
    if(e.target.value.trim()){ videoFile=null; $('#wVidPreview').style.display='none'; $('#wVidPreview').innerHTML=''; }
  });

  $('#writeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#wName').value.trim();
    const code = $('#wCode').value.trim();
    const title = $('#wTitle').value.trim();
    const cat = $('#wCat').value.trim();
    const body = $('#wBody').value.trim();
    const vidUrl = $('#wVidUrl').value.trim();
    if(!name || !title || !cat || !body){ toast('همه فیلدها را پر کنید','err'); return; }

    let user = state.me;
    if(!user){
      if(code){
        const found = state.users.find(u => u.code === code);
        if(!found){ toast('کد معتبر نیست','err'); return; }
        user = found;
      } else {
        let newCode;
        do { newCode = String(Math.floor(100000 + Math.random()*900000)); }
        while(state.users.some(u => u.code === newCode));
        user = { id: uid('u'), name, code: newCode, createdAt: Date.now() };
        state.users.push(user); LS.set('users', state.users);
        LS.set('session', user.id); state.me = user;
        showModal(`
          <div style="text-align:center">
            <div style="font-size:40px">🎉</div>
            <h3 style="margin:8px 0 4px">خوش آمدید ${esc(user.name)}!</h3>
            <p style="color:var(--muted);font-size:13px;margin:0">این کد اختصاصی شماست.</p>
            <div class="code-boxes">${user.code.split('').map((d,i)=>`<span style="animation-delay:${i*70}ms">${d}</span>`).join('')}</div>
            <button class="btn btn-primary" id="codeOk" style="width:100%">ذخیره کردم ✔</button>
          </div>`);
        $('#codeOk').onclick = () => closeModal();
      }
      if(!state.me){ state.me = user; LS.set('session', user.id); }
    }

    let videoId = '';
    if(videoFile){
      const btn = $('#wSubmit'); btn.disabled=true; btn.textContent='در حال ذخیره ویدیو…';
      try{ videoId = 'vid_'+uid('x'); await VDB.put(videoId, videoFile); }
      catch(err){ toast('ذخیره ویدیو ممکن نشد','err'); btn.disabled=false; btn.textContent='ارسال'; return; }
    }

    state.posts.unshift({
      id: uid('p'), title, category: cat,
      image: imgData || 'https://picsum.photos/seed/'+encodeURIComponent(title.slice(0,12))+'/1100/620',
      content: body.split(/\n{2,}/).map(t=>'<p>'+esc(t).replace(/\n/g,'<br>')+'</p>').join(''),
      author: user.name, userId: user.id,
      date: Date.now(), status:'pending', views:0, likes:0,
      videoId: videoId || '', videoUrl: (!videoId && vidUrl) ? vidUrl : '',
      pinned: false
    });
    LS.set('posts', state.posts);
    toast('مطلب ثبت شد و پس از تأیید منتشر می‌شود ✅','ok');
    setTimeout(()=>{ location.hash = '#/'; }, 1200);
  });
}

    const typeSel = $('#mType');
    const toggle = () => {
      $('#fCat').style.display = typeSel.value==='cat'?'block':'none';
      $('#fPage').style.display = typeSel.value==='page'?'block':'none';
      $('#fLink').style.display = typeSel.value==='link'?'block':'none';
    };
    typeSel.addEventListener('change', toggle); toggle();
    $('#menuForm').addEventListener('submit', e => {
      e.preventDefault();
      const item = {
        id: uid('m'), title: $('#mTitle').value.trim(), type: typeSel.value,
        cat: $('#mCat').value.trim(), content: $('#mContent').value.trim(), url: $('#mUrl').value.trim()
      };
      if(!item.title){ toast('عنوان را وارد کنید','err'); return; }
      state.config.menu.push(item);
      if(item.url === '#/contact') state.config._contactMenuDeleted = false;
      LS.set('config', state.config);
      applyConfig(); renderDrawer(); render();
      toast('گزینه اضافه شد ✅','ok');
    });
  }

  if(tab === 'contact'){
    $('#contactForm').addEventListener('submit', e => {
      e.preventDefault();
      const type = $('#cType').value;
      const value = $('#cValue').value.trim();
      let url = $('#cUrl').value.trim();
      if(!value){ toast('مقدار را وارد کنید','err'); return; }
      if(!url){
        if(type==='email')      url = 'mailto:' + value;
        else if(type==='eitaa') url = 'https://eitaa.com/' + value.replace(/^@/,'');
        else if(type==='phone') url = 'tel:' + value.replace(/\s/g,'');
        else                    url = value;
      }
      state.config.contact.push({ id: uid('c'), type, label: $('#cLabel').value.trim() || 'راه ارتباطی', value, url });
      LS.set('config', state.config); toast('کادر اضافه شد ✅','ok'); render();
    });
  }

  if(tab === 'settings'){
    let newLogo = state.config.logo;
    $('#sTheme').value = state.config.theme || 'orange';
    $('#sTheme').addEventListener('change', e => { document.documentElement.dataset.theme = e.target.value; });
    $('#sLogo').addEventListener('change', e => {
      readImage(e.target.files[0], d => { newLogo = d; $('#sLogoPv').src = d; });
    });

    /* ✅ پیش‌نمایش آنی متن‌ها هنگام تایپ */
    TEXT_LOCATIONS.forEach(loc => {
      ['name','slogan'].forEach(field => {
        const el = $('#s_'+loc+'_'+field);
        if(!el) return;
        el.addEventListener('input', () => {
          if(field === 'name'){
            if(loc === 'tab')         document.title = el.value.trim() + ' | ' + getText('tab','slogan');
            if(loc === 'header')      $('#siteName').textContent = el.value.trim() || state.config.siteName;
            if(loc === 'drawer')      $('#drawerName').textContent = el.value.trim() || state.config.siteName;
            if(loc === 'footer')      $('#footName').textContent = el.value.trim() || state.config.siteName;
            if(loc === 'loader')      $('#loaderName').textContent = el.value.trim() || state.config.siteName;
          } else {
            if(loc === 'tab')         document.title = getText('tab','name') + ' | ' + el.value.trim();
            if(loc === 'header')      $('#siteSlogan').textContent = el.value.trim() || state.config.slogan;
            if(loc === 'drawer')      $('#drawerSlogan').textContent = el.value.trim() || state.config.slogan;
            if(loc === 'footer')      $('#footSlogan').textContent = el.value.trim() || state.config.slogan;
            if(loc === 'loader')      $('#loaderSlogan').textContent = el.value.trim() || state.config.slogan;
          }
        });
      });
    });

    $('#setForm').addEventListener('submit', e => {
      e.preventDefault();
      state.config.siteName  = $('#sName').value.trim() || 'زوم‌تک';
      state.config.slogan    = $('#sSlogan').value.trim();
      state.config.logo      = newLogo;
      state.config.adminPass = $('#sPass').value.trim() || 'admin';
      state.config.theme     = $('#sTheme').value;

      /* ✅ ذخیره نام و شعار هر بخش */
      const newNames = {}, newSlogans = {};
      TEXT_LOCATIONS.forEach(loc => {
        newNames[loc]   = ($('#s_'+loc+'_name')?.value || '').trim();
        newSlogans[loc] = ($('#s_'+loc+'_slogan')?.value || '').trim();
      });
      state.config.names = newNames;
      state.config.slogans = newSlogans;

      LS.set('config', state.config);
      applyConfig(); renderDrawer(); render();
      toast('تنظیمات ذخیره شد ✅','ok');
    });

    $('#resetPosts').onclick = () => {
      if(!confirm('مطالب نمونه بازگردانی شوند؟')) return;
      state.posts = seedPosts(); LS.set('posts', state.posts); render();
      toast('بازگردانی شد','ok');
    };
    $('#resetAll').onclick = () => {
      if(!confirm('همه داده‌ها پاک شود؟')) return;
      localStorage.clear(); sessionStorage.clear();
      try{ indexedDB.deleteDatabase('zt_videos'); }catch(e){}
      location.reload();
    };
  }
}

/* =========================================================
   ویرایشگر مطلب
========================================================= */
function postEditorView(id){
  const p = id ? state.posts.find(x => x.id === id) : null;
  state.editorImage = p ? p.image : '';
  state.editorVideo = { id: p ? (p.videoId||'') : '', url: p ? (p.videoUrl||'') : '', file: null, removed: false };

  $('#app').innerHTML = `
    <a class="btn btn-line btn-sm reveal" href="#/admin/posts" style="margin-bottom:16px">← بازگشت</a>
    <div class="panel reveal">
      <h2 class="page-title">${p?'ویرایش':'مطلب جدید'}</h2>
      <form id="postForm">
        <div class="field"><label>عنوان</label><input type="text" id="fTitle" value="${esc(p?p.title:'')}" required></div>
        <div class="row">
          <div class="field"><label>دسته</label>
            <input type="text" id="fCat" list="cats2" value="${esc(p?p.category:'')}" required>
            <datalist id="cats2">${[...new Set(state.posts.map(x=>x.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>نویسنده</label><input type="text" id="fAuthor" value="${esc(p?p.author:'تحریریه زوم‌تک')}"></div>
        </div>
        <div class="field">
          <label>📌 سنجاق</label>
          <select id="fPinned">
            <option value="0" ${!p||!p.pinned?'selected':''}>عادی</option>
            <option value="1" ${p&&p.pinned?'selected':''}>📌 سنجاق‌شده</option>
          </select>
        </div>
        <div class="field">
          <label>عکس</label>
          <label class="filebox" for="fImg">📷 انتخاب عکس<input type="file" id="fImg" accept="image/*"></label>
          <div class="hint">یا آدرس:</div>
          <input type="text" id="fImgUrl" placeholder="https://..." value="${p&&p.image&&!p.image.startsWith('data:')?esc(p.image):''}">
          <img id="fPv" class="preview" src="${esc(state.editorImage||'')}" alt="">
        </div>
        <div class="field">
          <label>🎬 ویدیو</label>
          <label class="filebox" for="fVid">🎬 انتخاب ویدیو<input type="file" id="fVid" accept="video/*"></label>
          <div class="hint">یا لینک:</div>
          <input type="text" id="fVidUrl" dir="ltr" value="${esc(state.editorVideo.url)}">
          <div id="fVidPv" class="video-slot" style="margin-top:10px"></div>
          ${(state.editorVideo.id||state.editorVideo.url)?`<button type="button" class="btn btn-no btn-sm" id="fVidRemove" style="margin-top:8px">حذف ویدیو</button>`:''}
        </div>
        <div class="field">
          <label>متن</label>
          <textarea id="fBody" style="min-height:260px" required>${esc(p?(p.content||'').replace(/<p>/g,'').replace(/<\/p>/g,'\n\n').replace(/<br\s*\/?>/g,'\n'):'')}</textarea>
        </div>
        <button class="btn btn-primary" type="submit" id="postSubmit">${p?'ذخیره':'انتشار'}</button>
      </form>
    </div>`;

  const vpv = $('#fVidPv');
  if(state.editorVideo.url) vpv.innerHTML = videoEmbed(state.editorVideo.url);
  else if(state.editorVideo.id){
    VDB.get(state.editorVideo.id).then(blob => {
      if(blob) vpv.innerHTML = `<video controls src="${URL.createObjectURL(blob)}" preload="metadata"></video>`;
      else vpv.innerHTML = '<div class="hint">ویدیو یافت نشد.</div>';
    });
  }

  $('#fImg').addEventListener('change', e => {
    readImage(e.target.files[0], d => { state.editorImage = d; $('#fPv').src = d; });
  });
  $('#fImgUrl').addEventListener('input', e => {
    const v = e.target.value.trim();
    if(v){ state.editorImage = v; $('#fPv').src = v; }
  });

  $('#fVid').addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    if(!f.type.startsWith('video/')){ toast('فقط ویدیو','err'); e.target.value=''; return; }
    if(f.size > MAX_VIDEO_BYTES){ toast('حجم بیش از ۲۰۰MB','err'); e.target.value=''; return; }
    state.editorVideo.file = f; state.editorVideo.url = ''; state.editorVideo.removed = false;
    $('#fVidUrl').value = '';
    vpv.innerHTML = `<video controls src="${URL.createObjectURL(f)}" preload="metadata"></video>`;
    if(!state.editorImage || !state.editorImage.trim()){
      const thumb = await generateVideoThumbnail(f);
      if(thumb){ state.editorImage = thumb; $('#fPv').src = thumb; }
    }
  });
  $('#fVidUrl').addEventListener('input', e => {
    const v = e.target.value.trim();
    state.editorVideo.url = v;
    if(v){ state.editorVideo.file = null; vpv.innerHTML = videoEmbed(v); }
    else if(!state.editorVideo.id){ vpv.innerHTML = ''; }
  });

  const rmBtn = $('#fVidRemove');
  if(rmBtn) rmBtn.onclick = () => {
    if(!confirm('ویدیو حذف شود؟')) return;
    state.editorVideo.removed = true; state.editorVideo.file = null; state.editorVideo.url = '';
    $('#fVidUrl').value = '';
    vpv.innerHTML = '<div class="hint">حذف شد (بعد از ذخیره).</div>';
    rmBtn.remove();
  };

  $('#postForm').addEventListener('submit', async e => {
    e.preventDefault();
    const title = $('#fTitle').value.trim();
    const cat = $('#fCat').value.trim();
    const author = $('#fAuthor').value.trim() || 'تحریریه';
    const body = $('#fBody').value.trim();
    const isPinned = $('#fPinned').value === '1';
    if(!title || !cat || !body){ toast('فیلدها را پر کنید','err'); return; }
    const html = /<[a-z]/i.test(body) ? body
      : body.split(/\n{2,}/).map(t => '<p>'+esc(t).replace(/\n/g,'<br>')+'</p>').join('');
    const image = state.editorImage || ('https://picsum.photos/seed/'+encodeURIComponent(title.slice(0,10))+'/1100/620');

    let newVideoId = state.editorVideo.id || '';
    if(state.editorVideo.file){
      const btn = $('#postSubmit'); btn.disabled=true; btn.textContent='در حال ذخیره…';
      try{
        newVideoId = 'vid_'+uid('x');
        await VDB.put(newVideoId, state.editorVideo.file);
        if(state.editorVideo.id && state.editorVideo.id !== newVideoId) VDB.del(state.editorVideo.id);
      }catch(err){
        toast('ذخیره ویدیو ممکن نشد','err');
        btn.disabled=false; btn.textContent = p?'ذخیره':'انتشار'; return;
      }
    } else if(state.editorVideo.removed){
      if(state.editorVideo.id) VDB.del(state.editorVideo.id);
      newVideoId = '';
    }

    const videoUrl = state.editorVideo.file ? '' : (state.editorVideo.url || '');

    if(p){
      Object.assign(p, { title, category: cat, author, content: html, image, videoId: newVideoId, videoUrl, pinned: isPinned });
      toast('ویرایش شد ✅','ok');
    } else {
      state.posts.unshift({
        id: uid('p'), title, category: cat, author, content: html, image,
        date: Date.now(), status:'approved', views:0, likes:0,
        videoId: newVideoId, videoUrl, pinned: isPinned
      });
      toast(isPinned ? 'منتشر و سنجاق شد 📌' : 'منتشر شد ✅','ok');
    }
    LS.set('posts', state.posts);
    location.hash = '#/admin/posts';
  });
}

/* =========================================================
   کلیک سراسری
========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act === 'approve' || act === 'reject'){
    const p = state.posts.find(x => x.id === id); if(!p) return;
    p.status = act === 'approve' ? 'approved' : 'rejected';
    LS.set('posts', state.posts);
    toast(act === 'approve' ? 'تأیید شد ✅' : 'رد شد', act === 'approve' ? 'ok' : '');
    render();
  }
  if(act === 'pin'){
    const p = state.posts.find(x => x.id === id); if(!p) return;
    p.pinned = !p.pinned;
    LS.set('posts', state.posts);
    toast(p.pinned ? 'سنجاق شد 📌' : 'برداشته شد', 'ok');
    render();
  }
  if(act === 'delete'){
    if(!confirm('حذف شود؟')) return;
    const p = state.posts.find(x => x.id === id);
    if(p && p.videoId) VDB.del(p.videoId);
    state.posts = state.posts.filter(x => x.id !== id);
    LS.set('posts', state.posts); render(); toast('حذف شد');
  }
  if(act === 'edit'){ location.hash = '#/admin/edit/' + id; }

  if(act === 'delMenu'){
    if(!confirm('این گزینه حذف شود؟')) return;
    const m = (state.config.menu||[]).find(x => x.id === id);
    if(m && m.url === '#/contact') state.config._contactMenuDeleted = true;
    state.config.menu = (state.config.menu||[]).filter(x => x.id !== id);
    LS.set('config', state.config); applyConfig(); renderDrawer(); render();
    toast('گزینه حذف شد');
  }
  if(act === 'editMenu'){
    const m = (state.config.menu||[]).find(x => x.id === id); if(!m) return;
    showModal(`<h3 style="margin-top:0">ویرایش گزینه</h3>
      <div class="field"><label>عنوان</label><input type="text" id="emTitle" value="${esc(m.title)}"></div>
      <div class="field"><label>دسته</label><input type="text" id="emCat" value="${esc(m.cat||'')}"></div>
      <div class="field"><label>متن برگه</label><textarea id="emContent">${esc(m.content||'')}</textarea></div>
      <div class="field"><label>لینک</label><input type="text" id="emUrl" value="${esc(m.url||'')}"></div>
      <button class="btn btn-primary" id="emSave" style="width:100%">ذخیره</button>`);
    $('#emSave').onclick = () => {
      m.title = $('#emTitle').value.trim() || m.title;
      m.cat = $('#emCat').value.trim();
      m.content = $('#emContent').value.trim();
      m.url = $('#emUrl').value.trim();
      if(m.url === '#/contact') state.config._contactMenuDeleted = false;
      LS.set('config', state.config); applyConfig(); renderDrawer(); closeModal(); render();
      toast('ویرایش شد ✅','ok');
    };
  }

  if(act === 'delContact'){
    if(!confirm('کادر حذف شود؟')) return;
    state.config.contact = (state.config.contact||[]).filter(c => c.id !== id);
    LS.set('config', state.config); render(); toast('حذف شد');
  }
  if(act === 'editContact'){
    const c = (state.config.contact||[]).find(x => x.id === id); if(!c) return;
    showModal(`<h3 style="margin-top:0">ویرایش کادر</h3>
      <div class="field"><label>عنوان</label><input type="text" id="ecLabel" value="${esc(c.label)}"></div>
      <div class="field"><label>مقدار</label><input type="text" id="ecValue" dir="ltr" value="${esc(c.value)}"></div>
      <div class="field"><label>لینک</label><input type="text" id="ecUrl" dir="ltr" value="${esc(c.url||'')}"></div>
      <button class="btn btn-primary" id="ecSave" style="width:100%">ذخیره</button>`);
    $('#ecSave').onclick = () => {
      c.label = $('#ecLabel').value.trim() || c.label;
      c.value = $('#ecValue').value.trim();
      c.url = $('#ecUrl').value.trim();
      LS.set('config', state.config); closeModal(); render(); toast('ذخیره شد ✅','ok');
    };
  }

  if(act === 'delUser'){
    if(!confirm('حذف شود؟')) return;
    state.users = state.users.filter(u => u.id !== id);
    LS.set('users', state.users);
    if(state.me && state.me.id === id){ state.me = null; LS.set('session', null); }
    render();
  }
});

/* =========================================================
   روتر
========================================================= */
function render(){
  try{
    const hash = location.hash.slice(1) || '/';
    const parts = hash.split('/').filter(Boolean);
    window.scrollTo(0, 0);
    closeDrawer();

    if(parts[0] === 'post')         viewPost(parts[1]);
    else if(parts[0] === 'write')   viewWrite();
    else if(parts[0] === 'contact') viewContact();
    else if(parts[0] === 'admin')   viewAdmin(parts.slice(1));
    else if(parts[0] === 'page')    viewPage(parts[1]);
    else if(parts[0] === 'cat')     viewHome(decodeURIComponent(parts[1] || ''));
    else                            viewHome(null);

    requestAnimationFrame(() => observeReveal());
  }catch(err){
    console.error('Render error:', err);
    $('#app').innerHTML = `<div class="empty">خطایی رخ داد. صفحه را رفرش کنید.</div>`;
  }
}

/* =========================================================
   راه‌اندازی
========================================================= */
function boot(){
  try{
    loadState();
    applyConfig();
    renderDrawer();
    render();

    $('#menuBtn').addEventListener('click', () => {
      $('#drawer').classList.contains('open') ? closeDrawer() : openDrawer();
    });
    $('#overlay').addEventListener('click', closeDrawer);
    $('#modalWrap').addEventListener('click', e => { if(e.target.id === 'modalWrap') closeModal(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDrawer(); closeModal(); } });
    window.addEventListener('hashchange', render);
  }catch(err){
    console.error('Boot error:', err);
  }

  setTimeout(() => {
    const l = $('#loader');
    if(l){ l.classList.add('hide'); setTimeout(() => l.remove(), 700); }
  }, 950);
}

boot();
</script>
